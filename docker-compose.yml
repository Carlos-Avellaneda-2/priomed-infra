# Entorno local de desarrollo. Asume que los repos están como carpetas hermanas:
#   ../priomed-classification-service
services:
  classification:
    build: ../priomed-classification-service
    ports: ["8000:8000"]
    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on: [redis]

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: priomed
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD en .env}
      POSTGRES_DB: priomed
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]

  redis:
    image: redis:7
    ports: ["6379:6379"]

volumes:
  pgdata:

# VirtualHost de PrioMed para Apache httpd en la instancia EC2.
# Se selecciona por cabecera Host (nombre wildcard nip.io / sslip.io que resuelve a la IP
# pública), así que convive con otros VirtualHost del mismo servidor sin modificarlos:
# el acceso por IP desnuda sigue yendo al VirtualHost por defecto existente.
<VirtualHost *:80>
    ServerName priomed.__PUBLIC_IP__.nip.io
    ServerAlias priomed.__PUBLIC_IP__.sslip.io

    # Portal estático: demo + documentación (priomed-docs)
    DocumentRoot /var/www/priomed
    <Directory /var/www/priomed>
        Options -Indexes
        AllowOverride None
        Require all granted
    </Directory>

    # API del servicio de clasificación (contenedor publicado solo en 127.0.0.1:8000)
    ProxyPreserveHost On
    ProxyPass        /health       http://127.0.0.1:8000/health
    ProxyPassReverse /health       http://127.0.0.1:8000/health
    ProxyPass        /classify     http://127.0.0.1:8000/classify
    ProxyPassReverse /classify     http://127.0.0.1:8000/classify
    ProxyPass        /docs         http://127.0.0.1:8000/docs
    ProxyPassReverse /docs         http://127.0.0.1:8000/docs
    ProxyPass        /openapi.json http://127.0.0.1:8000/openapi.json
    ProxyPassReverse /openapi.json http://127.0.0.1:8000/openapi.json

    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    Header always set Referrer-Policy "no-referrer"

    ErrorLog  /var/log/httpd/priomed-error.log
    CustomLog /var/log/httpd/priomed-access.log combined
</VirtualHost>

# VirtualHost HTTPS de PrioMed. deploy-ec2.sh lo instala solo cuando existe el certificado de
# Let's Encrypt para priomed.<IP>.nip.io. Mismo contenido que el VirtualHost HTTP.
<VirtualHost *:443>
    ServerName priomed.__PUBLIC_IP__.nip.io

    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/priomed.__PUBLIC_IP__.nip.io/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/priomed.__PUBLIC_IP__.nip.io/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf

    DocumentRoot /var/www/priomed
    <Directory /var/www/priomed>
        Options -Indexes
        AllowOverride None
        Require all granted
    </Directory>

    ProxyPreserveHost On
    ProxyPass        /health       http://127.0.0.1:8000/health
    ProxyPassReverse /health       http://127.0.0.1:8000/health
    ProxyPass        /classify     http://127.0.0.1:8000/classify
    ProxyPassReverse /classify     http://127.0.0.1:8000/classify
    ProxyPass        /docs         http://127.0.0.1:8000/docs
    ProxyPassReverse /docs         http://127.0.0.1:8000/docs
    ProxyPass        /openapi.json http://127.0.0.1:8000/openapi.json
    ProxyPassReverse /openapi.json http://127.0.0.1:8000/openapi.json

    Header always set Strict-Transport-Security "max-age=300"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    Header always set Referrer-Policy "no-referrer"

    ErrorLog  /var/log/httpd/priomed-ssl-error.log
    CustomLog /var/log/httpd/priomed-ssl-access.log combined
</VirtualHost>
